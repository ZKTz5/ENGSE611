<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LOGO</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
        }

        .menu-container {
            display: grid;
            grid-template-columns: 150px 1fr;
            grid-template-rows: 50px;
            align-items: center;
            padding: 10px 20px;
            background-color: #333;
            color: white;
        }

        .logo {
            text-align: center;
            font-size: 24px;
            font-weight: bold;
        }

        ul {
            display: flex;
            list-style: none;
            align-items: center;
            gap: 20px;
            margin: 0px;
            padding: 0px;
        }

        ul li a {
            color: white;
            text-decoration: none;
            font-size: 18px;
        }

        ul li a:hover {
            text-decoration: underline;
        }

    </style>
</head>
<body>
    <div class="menu-container"> 
        <div class="logo">SAMSUNG</div>
        <ul>
            <li><a href="#">Home</a></li>
            <li><a href="#">About</a></li>
            <li><a href="#">Services</a></li>
            <li><a href="#">Contact</a></li>
        </ul>
    </div>
</body>
</html>
