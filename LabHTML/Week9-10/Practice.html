<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Modern Css Features</title>

    <style>
        /*CSS Variables (Mobile First)*/
        :root {
            --padding: 16px;
            --bg-color: #e0e0e0;
            --card-bg: #ffffff;
            --text-color : #333333;
        }

        /* ปรับค่าเมื่อจอใหญ่ขึ้น */
        
        @media (min-width: 768px) {
            :root {
                --padding: 32px;
            }
        }

        body {
            margin: 0;
            font-family: Tahoma, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
        }

        /*Container สำหรับ Typography*/
        h1 {
            font-size: clamp(1.6rem, 4vw, 2.8rem); /*ขนาดตัวอักษรปรับตามขนาดจอ*/
        }

        p {
            font-size: clamp(0.95rem, 2.5vw, 1.1rem);
            line-height: 1.6;
        }
    </style>
</head>
<body>
    <div class="Container">
        <h1>Modern CSS Features</h1>

        <p>
            ตัวอย่างนีนี้แสดงการใช้ CSS Variables และฟังก์ชัน lamp() เพื่อทำ Responsive Design โดยไม่ต้องเขียน Media Query จำนวนมาก
        </p>

        <p>
            เมื่อขยายหรือย่อหน้าจอ จะเห็นว่าระยะขอบและขนาดตัวอักษรปรับเปลี่ยนอย่างอัตโนมัติและลื่นไหล
        </p>
    </div>
</body>
</html>
