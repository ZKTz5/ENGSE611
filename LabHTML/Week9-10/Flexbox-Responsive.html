<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flexbox-Responsive</title>

    <style>
        body {
            font-family: Tahoma, sans-serif;
            margin: 20px;
            background-color: #f0f2f5;
        }
        /*Flex Container*/
        .flex-container {
            display: flex;
            flex-direction: column; /* เรียงจากบนลงล่าง */
            gap: 15px; /* ระยะห่างระหว่างกล่อง */
            padding: 15px;
            border-radius: 10px;
            background: #e9edf2;
        }

        /*ChildBox*/
        .item {
            background: #263547;
            color: white;
            height: 120px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
            border-radius: 8px;
        }

        /*Media Query for Tablet*/
        @media (min-width: 768px) {
            .flex-container {
                flex-direction: row;    /* เรียงจากซ้ายไปขวา */
                flex-wrap: wrap;    /*ตัดบรรทัด*/
            }
            .item {
                flex: 1 1 45%;  /* 2กล่องต่อแถว */
            }
        }

        /*Media Query for Desktop*/
        @media (min-width: 1024px) {
            .flex-container {
                flex-wrap: nowrap;  /*ไม่ตัดบรรทัด*/
            }

            .item {
                flex: 1;
            }
        }

    </style>
</head>
<body>
    <h1>Flexbox กับ Responsive</h1>

    <div class="flex-container">
        <div class="item">Item 1</div>
        <div class="item">Item 2</div>
        <div class="item">Item 3</div>
        <div class="item">Item 4</div>
        <div class="item">Item 5</div>
    </div>
</body>
</html>
