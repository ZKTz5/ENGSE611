<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Typography</title>

    <style>
        /*Mobile*/
        p {
            font-size: 14px;
            line-height: 1.6;
        }

        /*Tablet*/
        @media (min-width: 768px) {
            p {
                font-size: 26px;
            }
        }

        /*Desktop*/
        @media (min-width: 1024px) {
            p {
                font-size: 36px;
            }
        }
    </style>
</head>
<body>
    <p>This is a responsive typography example.</p>
    <br></br>
    <p>TEST test Test 1234567890</p>
</body>
</html>
