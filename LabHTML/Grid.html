<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
        }
        /* Grid Layout Styles */
        .grid-container {
            display: grid;
            grid-template: 
                "header header" 70px
                "aside main" 530px
                "footer footer" 70px
                / 20% 80%;
            gap: 10px;
            padding: 10px;
            background-color: aliceblue;
            height: 100vh;
            box-sizing: border-box;
        }

        header{
            grid-area: header;
            background-color: lightcoral;
            color: white;
            text-align: center; line-height: 70px; font-size: 24px;
        }

        aside{
            grid-area: aside;
            background-color: lightseagreen;
            color: white;
            text-align: center; line-height: 530px; font-size: 24px;
        }

        main{
            grid-area: main;
            background-color: lightsalmon;
            color: white;
            text-align: center; line-height: 530px; font-size: 24px;
        }

        footer{
            grid-area: footer;
            background-color: lightblue;
            color: white;
            text-align: center; line-height: 70px; font-size: 24px;
        }

    </style>
</head>
<body>
    <div class="grid-container">
        <header>Header</header>
        <aside>Aside</aside>
        <main>Main Content</main>
        <footer>Footer</footer>
    </div>
    
    
</body>
</html>
