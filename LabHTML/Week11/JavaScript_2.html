<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JavaScript EX2</title>
</head>
<body>
    
    <h1>JavaScript แบบฝังใน html</h1>

    <button onclick="showMessage()">Run Code</button>
    <script>
        function showMessage() {
            //clear console ทุกครั้งที่รัน เพื่อไม่ให้สับสนกับผลเก่า
            console.clear();
            const output = [];

            let stundentName = "สมชาย";
            let age = 20;
            let isStundent = true;
            const universityName = "มหาวิทยาลัยเทคโนโลยี";
            //แสดงค่าตัวแปรเริ่มต้น
            output.push("ชื่อ: " + stundentName);
            console.log("ชื่อ: " + stundentName);
            output.push("อายุ: " + age);
            console.log("อายุ: " + age);

            //เปลี่ยนค่า let
            age = 21;
            output.push("อายุใหม่: " + age);
            console.log("อายุใหม่: " + age);
            //เปลี่ยนค่า const จะ error (อยู่ใน catch)
            try {
                universityName = "มหาวิทยาลัยใหม่";    //ทำให้เิด TypeError
            } catch (e) {
                output.push("Error: " + e.message);
                console.error(e.message);      //แสดงใน console เป็นสีแดง
            }
        }

        console.log("โค้ดใน script กำลังทำงาน...");
    </script>
</body>
</html>
