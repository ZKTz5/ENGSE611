<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JavaScript EX1</title>
</head>
<body>
    
    <h1>JavaScript แบบฝังใน html</h1>

    <button onclick="showMessage()">กดเพื่อแสดงข้อความ</button>
    <script>
        function showMessage() {
            alert("นี่คือข้อความจาก JavaScript ในแท็ก");
        }

        console.log("โค้ดใน script กำลังทำงาน...");
    </script>
</body>
</html>
