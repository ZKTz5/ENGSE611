<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gride System</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
        }

        .grid-container {
            display: grid;
            grid-template-columns: 100px 100px 100px;
            grid-template-rows: 100px 100px;
            gap: 10px;
            padding: 10px;
            background-color: #f0f0f0;
        }

        .item {
            background-color: rgb(94, 190, 158);
            color: white;
            font-size: 15px;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .item1 {
            grid-column: 1 / 3; /* spans from column 1 to column 3 */
        }

        .item3 {
            grid-row: 2 / 3; /* occupies row 2 */
        }
    </style>
</head>

<body>
    <div class="grid-container">
        <div class="item item1">Item 1 (col 1-2)</div>
        <div class="item">Item 2 (col 3)</div>
        <div class="item item3">Item 3</div>
        <div class="item">Item 4 (col 2)</div>
        <div class="item">Item 5</div>
    </div>
    
</body>
</html>
